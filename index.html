<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Check public Shopee Philippines price history, product variations, lowest prices and recorded price changes with PriceTrack PH." />
    <link rel="canonical" href="https://pricetrackph.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PriceTrack PH" />
    <meta property="og:title" content="Shopee Price Tracker Philippines &amp; Price History | PriceTrack PH" />
    <meta property="og:description" content="Check public Shopee Philippines price history, product variations, lowest prices and recorded price changes with PriceTrack PH." />
    <meta property="og:url" content="https://pricetrackph.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Shopee Price Tracker Philippines &amp; Price History | PriceTrack PH" />
    <meta name="twitter:description" content="Check public Shopee Philippines price history, product variations, lowest prices and recorded price changes with PriceTrack PH." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>Shopee Price Tracker Philippines &amp; Price History | PriceTrack PH</title>
    <script id="site-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://pricetrackph.com/#website",
            "url": "https://pricetrackph.com/",
            "name": "PriceTrack PH",
            "description": "Shopee Philippines price history and product variation tracker",
            "inLanguage": "en-PH"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://pricetrackph.com/#application",
            "name": "PriceTrack PH",
            "url": "https://pricetrackph.com/",
            "applicationCategory": "ShoppingApplication",
            "operatingSystem": "Google Chrome",
            "description": "A browser extension and public website for recording and viewing Shopee Philippines product price history.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "PHP"
            }
          }
        ]
      }
    </script>
    <script>
      (() => {
        const saved = localStorage.getItem("pricetrack-theme");
        const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = saved || preferred;
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="/" data-scroll-target="top">PriceTrack <span>PH</span></a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="/" data-scroll-target="top">How it works</a>
          <a href="/" data-scroll-target="extension">Extension</a>
          <a href="/" data-scroll-target="support">Support us</a>
        </nav>
        <div class="header-actions">
          <button class="theme-switch" id="theme-toggle" type="button" aria-label="Toggle light and dark mode">
            <span data-theme-label="light">☀ Light</span>
            <span data-theme-label="dark">☾ Dark</span>
          </button>
        </div>
      </div>
    </header>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const toggle = document.getElementById("theme-toggle");
        if (toggle) {
          const apply = (theme) => {
            document.documentElement.dataset.theme = theme;
            localStorage.setItem("pricetrack-theme", theme);
            toggle.dataset.themeCurrent = theme;
            toggle.setAttribute("aria-label", `Switch to ${theme === "dark" ? "light" : "dark"} mode`);
          };

          toggle.addEventListener("click", () => {
            const current = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
            apply(current === "dark" ? "light" : "dark");
          });

          apply(document.documentElement.dataset.theme || "light");
        }

        document.querySelectorAll("[data-scroll-target]").forEach((link) => {
          link.addEventListener("click", (event) => {
            if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            const targetId = link.getAttribute("data-scroll-target");
            const target = targetId ? document.getElementById(targetId) : null;
            if (!target) return;
            event.preventDefault();
            target.scrollIntoView({ behavior: "smooth", block: "start" });
            if (window.location.hash) {
              history.replaceState(null, "", window.location.pathname + window.location.search);
            }
          });
        });

        const isMobile = () => window.matchMedia("(max-width: 768px)").matches;
        const looksLikeUrl = (value) => /^https?:\/\//i.test(value);
        let resolvingExactTitle = false;

        const setInputValue = (input, value) => {
          const nativeSetter = Object.getOwnPropertyDescriptor(
            HTMLInputElement.prototype,
            "value",
          )?.set;
          nativeSetter?.call(input, value);
          input.dispatchEvent(new Event("input", { bubbles: true }));
        };

        const removeTitleSearchError = () => {
          document.querySelector(".title-search-error")?.remove();
        };

        const showTitleSearchError = (form, message) => {
          removeTitleSearchError();
          const error = document.createElement("div");
          error.className = "error title-search-error";
          error.setAttribute("role", "alert");
          error.textContent = message;
          form.insertAdjacentElement("afterend", error);
        };

        document.addEventListener("submit", async (event) => {
          const form = event.target;
          if (!(form instanceof HTMLFormElement) || !form.classList.contains("search-box")) return;

          const input = form.querySelector("input");
          if (!(input instanceof HTMLInputElement)) return;

          const submittedValue = input.value.trim();
          if (!submittedValue || looksLikeUrl(submittedValue) || resolvingExactTitle) return;

          event.preventDefault();
          event.stopImmediatePropagation();
          removeTitleSearchError();
          resolvingExactTitle = true;

          try {
            const response = await fetch(`/api/find-product-by-title?title=${encodeURIComponent(submittedValue)}`, {
              headers: { Accept: "application/json" },
            });
            const payload = await response.json().catch(() => ({}));

            if (!response.ok || typeof payload.productUrl !== "string" || !payload.productUrl.trim()) {
              showTitleSearchError(
                form,
                payload.error || "No exact product title match found in the PriceTrack database.",
              );
              return;
            }

            setInputValue(input, payload.productUrl.trim());
            resolvingExactTitle = false;
            form.requestSubmit();
          } catch {
            showTitleSearchError(form, "Could not search the PriceTrack database right now.");
          } finally {
            resolvingExactTitle = false;
          }
        }, true);

        document.addEventListener("submit", (event) => {
          const form = event.target;
          if (!(form instanceof HTMLFormElement) || !form.classList.contains("search-box") || !isMobile()) return;

          const input = form.querySelector("input");
          const button = form.querySelector("button");
          if (!(input instanceof HTMLInputElement) || !(button instanceof HTMLButtonElement)) return;

          const submittedValue = input.value.trim();
          if (!submittedValue) return;

          let finished = false;
          const finishCheck = () => {
            if (finished) return;
            const stillLoading = button.textContent?.includes("Checking") ?? false;
            if (stillLoading) return;

            const error = document.querySelector(".hero-band .error");
            const foundStatus = document.querySelector(".hero-band .found-status");
            const report = document.querySelector(".report-section");

            if (!error && foundStatus && report) {
              finished = true;
              setInputValue(input, "");

              requestAnimationFrame(() => {
                report.scrollIntoView({ behavior: "smooth", block: "start" });
              });
            }
          };

          const observer = new MutationObserver(() => finishCheck());
          observer.observe(document.getElementById("root") || document.body, {
            childList: true,
            subtree: true,
            characterData: true,
          });

          const stop = () => observer.disconnect();
          const timeout = window.setTimeout(() => {
            finishCheck();
            stop();
          }, 15000);

          const interval = window.setInterval(() => {
            finishCheck();
            if (finished) {
              window.clearInterval(interval);
              window.clearTimeout(timeout);
              stop();
            }
          }, 100);
        });

        if (window.location.hash) {
          history.replaceState(null, "", window.location.pathname + window.location.search);
        }
      })();
    </script>
  </body>
</html>
