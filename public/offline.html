<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121917" />
    <title>PriceTrack PH — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0c1210; color: #fff; }
      main { width: min(88vw, 520px); padding: 32px; border: 1px solid #33423d; border-radius: 22px; background: #121917; }
      span { color: #08dbb4; }
      p { color: #c6cecb; line-height: 1.6; }
      button { border: 0; border-radius: 12px; padding: 13px 18px; color: #fff; background: #30207f; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>PriceTrack <span>PH</span></h1>
      <h2>You’re offline</h2>
      <p>Reconnect to the internet to resolve Shopee links and load current database reports.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
