name: One-off add last checked label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-add-last-checked.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch App.tsx
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/App.tsx';
          let s = fs.readFileSync(path, 'utf8');

          const helperAnchor = `function countPriceChanges(points: ChartPoint[]) {\n  let changes = 0;\n  for (let index = 1; index < points.length; index += 1) {\n    if (points[index].price !== points[index - 1].price) changes += 1;\n  }\n  return changes;\n}\n`;
          const helper = `${helperAnchor}\nfunction formatLastChecked(value: string | null | undefined) {\n  if (!value) return null;\n  const timestamp = Date.parse(value);\n  if (!Number.isFinite(timestamp)) return null;\n\n  const elapsedSeconds = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));\n  if (elapsedSeconds < 60) return \"just now\";\n\n  const minutes = Math.floor(elapsedSeconds / 60);\n  if (minutes < 60) return \`${'${minutes}'} min ago\`;\n\n  const hours = Math.floor(minutes / 60);\n  if (hours < 24) return \`${'${hours}'} hr${'${hours === 1 ? \"\" : \"s\"}'} ago\`;\n\n  const days = Math.floor(hours / 24);\n  if (days < 7) return \`${'${days}'} day${'${days === 1 ? \"\" : \"s\"}'} ago\`;\n\n  return fullDateFormatter.format(new Date(timestamp));\n}\n`;
          if (!s.includes('function formatLastChecked(')) {
            if (!s.includes(helperAnchor)) throw new Error('helper anchor not found');
            s = s.replace(helperAnchor, helper);
          }

          const constAnchor = `  const outboundLink = resolveOutboundLink(product);\n  const priceChanges = countPriceChanges(allVariationPoints);\n  const axis = useMemo(() => roundedAxis(chartData), [chartData]);`;
          const constReplacement = `  const outboundLink = resolveOutboundLink(product);\n  const priceChanges = countPriceChanges(allVariationPoints);\n  const lastCheckedLabel = formatLastChecked(product?.last_seen_at);\n  const axis = useMemo(() => roundedAxis(chartData), [chartData]);`;
          if (!s.includes('const lastCheckedLabel = formatLastChecked(')) {
            if (!s.includes(constAnchor)) throw new Error('const anchor not found');
            s = s.replace(constAnchor, constReplacement);
          }

          const pAnchor = `                    <p>{priceChanges} recorded price change{priceChanges === 1 ? \"\" : \"s\"}</p>`;
          const pReplacement = `                    <p>\n                      {priceChanges} recorded price change{priceChanges === 1 ? \"\" : \"s\"}\n                      {lastCheckedLabel ? \` · Last checked ${'${lastCheckedLabel}'}\` : \"\"}\n                    </p>`;
          if (!s.includes('Last checked ${lastCheckedLabel}')) {
            if (!s.includes(pAnchor)) throw new Error('price-change line anchor not found');
            s = s.replace(pAnchor, pReplacement);
          }

          fs.writeFileSync(path, s);
          NODE
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name "PriceTrackPH Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/oneoff-add-last-checked.yml
          git add src/App.tsx .github/workflows/oneoff-add-last-checked.yml
          git commit -m "Show product last checked time"
          git push origin HEAD:main
