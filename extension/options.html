<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="options.css">
  <title>PriceTrack PH Settings</title>
</head>
<body>
  <main>
    <header><span class="logo-dot"></span><strong>PriceTrack <b>PH</b></strong><span>Settings</span></header>
    <section>
      <p class="eyebrow">KEYBOARD SHORTCUT</p>
      <h1>Open price history</h1>
      <p class="description">Choose the key you want to use while viewing a Shopee product. It will not run while you are typing in a field.</p>
      <label for="shortcut-input">Shortcut key</label>
      <div class="shortcut-row">
        <input id="shortcut-input" type="text" readonly placeholder="Click here, then press a key" aria-describedby="shortcut-help">
        <button id="clear" class="secondary" type="button">Clear</button>
      </div>
      <small id="shortcut-help">Single keys and combinations are supported.</small>
      <label class="enabled-row">
        <span><strong>Enable shortcut</strong><small>Apply changes immediately on open Shopee pages.</small></span>
        <input id="enabled" type="checkbox">
      </label>
      <button id="save" type="button">Save settings</button>
      <p id="message" role="status"></p>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
