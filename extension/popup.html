<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>PriceTrack PH</title>
</head>
<body>
  <main>
    <header>
      <div class="brand-mark" aria-hidden="true"><span></span></div>
      <div class="brand-copy"><strong>PriceTrack <b>PH</b></strong><small>Shopee price history companion</small></div>
      <span class="version" id="version">v1.0.0</span>
    </header>
    <section id="detected" class="detected">
      <span class="check">✓</span>
      <div><strong id="title">Checking this page…</strong><p id="detail">Public product information only</p></div>
    </section>
    <div class="setting-row">
      <div>
        <strong>Notifications</strong>
        <p>Show alerts when PriceTrack finishes checking a product.</p>
      </div>
      <label class="switch" aria-label="PriceTrack notifications">
        <input id="popup-toggle" type="checkbox">
        <span class="slider"></span>
      </label>
    </div>
    <button id="open" disabled>View price history <span>→</span></button>
    <div class="status-line"><span class="privacy-dot"></span><p id="status" role="status">Automatically saves today’s first price and any later changes.</p></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
